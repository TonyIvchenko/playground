<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facemesh</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #18202a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffffff 0%, #eef3fa 58%);
    }

    .app {
      width: min(100vw, 1180px);
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 260px;
      gap: 20px;
      align-items: start;
    }

    .viewer {
      min-width: 0;
    }

    .panel {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 14px 36px rgba(34, 52, 76, 0.10);
      backdrop-filter: blur(10px);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #334155;
    }

    .reference-viewer img,
    .reference-viewer canvas {
      transform: none;
    }

    .reference-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #e8edf4;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
    }

    .reference-stage img,
    .reference-stage canvas {
      display: block;
      width: 100%;
    }

    .reference-stage canvas {
      position: absolute;
      inset: 0;
      height: 100%;
      pointer-events: none;
    }

    .reference-caption {
      margin-top: 14px;
      color: #5f6d7b;
      font-size: 13px;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0 0 16px;
      color: #5f6d7b;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #e8edf4;
      box-shadow: 0 20px 60px rgba(34, 52, 76, 0.14);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
    }

    canvas {
      pointer-events: none;
    }

    .status {
      margin-top: 14px;
      min-height: 24px;
      color: #5f6d7b;
      font-size: 14px;
    }

    @media (max-width: 840px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="app">
    <h1>Facemesh</h1>
    <p>Allow camera access to see the MediaPipe face mesh grid drawn on your face.</p>
    <div class="layout">
      <section class="viewer">
        <section class="stage">
          <video class="input_video" playsinline></video>
          <canvas class="output_canvas"></canvas>
        </section>
        <div class="status" id="status">Starting camera...</div>
      </section>
      <section class="viewer reference-viewer">
        <section class="reference-stage">
          <img
            id="reference-image"
            src="https://instagram.fcps3-1.fna.fbcdn.net/v/t51.82787-15/626071791_18063758177643979_3217503898408863517_n.jpg?stp=dst-jpg_e35_tt6&efg=eyJ2ZW5jb2RlX3RhZyI6InRocmVhZHMuRkVFRC5pbWFnZV91cmxnZW4uMTQ2OHgxNDQwLnNkci5mODI3ODcuZGVmYXVsdF9pbWFnZS5jMiJ9&_nc_ht=instagram.fcps3-1.fna.fbcdn.net&_nc_cat=107&_nc_oc=Q6cZ2gHtCjTHlZN97iAQf3_6rpVvGkHojjbTl5wt-diUrugluJNkht8--Qn8FWUhPuP7zi9g2Sl2dqLDLTzFLvBmAAPR&_nc_ohc=RapNfBsJu3MQ7kNvwFNdLs0&_nc_gid=BcAt5pyyUgH_HEJnSNzNSA&edm=AKr904kBAAAA&ccb=7-5&ig_cache_key=MzUyNDYwNzEzMzMwMDc3NTc5Mw%3D%3D.3-ccb7-5&oh=00_AfzL-omBZI86ub2IdjGH_QnfTuhXOyl9p3q1dxGn8cVy1w&oe=69C23572&_nc_sid=23467f"
            alt="Reference face"
            crossorigin="anonymous"
          >
          <canvas id="reference-canvas"></canvas>
        </section>
        <div class="reference-caption" id="reference-status">Loading reference image...</div>
      </section>
      <aside class="panel">
        <h2>Controls</h2>
        <label class="control">
          <input id="show-mesh" type="checkbox" checked>
          <span>Show mesh</span>
        </label>
      </aside>
    </div>
  </main>
  <script>
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusElement = document.getElementById('status');
    const showMeshInput = document.getElementById('show-mesh');
    const referenceImage = document.getElementById('reference-image');
    const referenceCanvas = document.getElementById('reference-canvas');
    const referenceCtx = referenceCanvas.getContext('2d');
    const referenceStatusElement = document.getElementById('reference-status');
    const faceMeshTesselation = typeof FACEMESH_TESSELATION !== 'undefined' ? FACEMESH_TESSELATION : [];
    const faceMeshContours = typeof FACEMESH_CONTOURS !== 'undefined' ? FACEMESH_CONTOURS : [];
    const leftEyeCenterIndex = 468;
    const rightEyeCenterIndex = 473;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function setReferenceStatus(message) {
      referenceStatusElement.textContent = message;
    }

    function resizeCanvas() {
      const width = videoElement.videoWidth || 960;
      const height = videoElement.videoHeight || 720;
      canvasElement.width = width;
      canvasElement.height = height;
    }

    function resizeReferenceCanvas() {
      const width = referenceImage.clientWidth || referenceImage.naturalWidth || 320;
      const height = referenceImage.clientHeight || referenceImage.naturalHeight || 320;
      referenceCanvas.width = width;
      referenceCanvas.height = height;
    }

    let isProcessing = false;
    let lastSubmittedTime = -1;
    let stream = null;
    let latestLandmarks = [];
    let latestReferenceLandmarks = [];

    function drawEyeDot(ctx, width, height, landmarks, index) {
      const point = landmarks[index];
      if (!point) {
        return;
      }

      ctx.beginPath();
      ctx.arc(
        point.x * width,
        point.y * height,
        1.6,
        0,
        Math.PI * 2,
      );
      ctx.fill();
    }

    function drawMesh(ctx, width, height, landmarksList) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';

      if (showMeshInput.checked) {
        for (const landmarks of landmarksList) {
          drawConnectors(ctx, landmarks, faceMeshTesselation, {
            color: '#ffffff',
            lineWidth: 0.5,
          });
          drawConnectors(ctx, landmarks, faceMeshContours, {
            color: '#ffffff',
            lineWidth: 0.8,
          });
          drawEyeDot(ctx, width, height, landmarks, leftEyeCenterIndex);
          drawEyeDot(ctx, width, height, landmarks, rightEyeCenterIndex);
        }
      }
    }

    function drawOverlay() {
      resizeCanvas();
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      drawMesh(canvasCtx, canvasElement.width, canvasElement.height, latestLandmarks);
      canvasCtx.restore();
    }

    function drawReferenceOverlay() {
      resizeReferenceCanvas();
      referenceCtx.clearRect(0, 0, referenceCanvas.width, referenceCanvas.height);
      drawMesh(referenceCtx, referenceCanvas.width, referenceCanvas.height, latestReferenceLandmarks);
    }

    function onResults(results) {
      latestLandmarks = results.multiFaceLandmarks || [];
      setStatus(latestLandmarks.length > 0 ? 'Face mesh active.' : 'No face detected.');
    }

    function createFaceMesh(onResultsHandler) {
      const mesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
      });

      mesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      mesh.onResults(onResultsHandler);
      return mesh;
    }

    function onReferenceResults(results) {
      latestReferenceLandmarks = results.multiFaceLandmarks || [];
      drawReferenceOverlay();
      setReferenceStatus(latestReferenceLandmarks.length > 0 ? 'Reference mesh ready.' : 'No face detected in reference image.');
    }

    const faceMesh = createFaceMesh(onResults);
    const referenceFaceMesh = createFaceMesh(onReferenceResults);

    showMeshInput.addEventListener('change', () => {
      drawOverlay();
      drawReferenceOverlay();
    });

    async function processReferenceImage() {
      resizeReferenceCanvas();
      drawReferenceOverlay();
      await referenceFaceMesh.send({image: referenceImage}).catch((error) => {
        console.error(error);
        setReferenceStatus('Reference image mesh failed. Check the browser console.');
      });
    }

    referenceImage.addEventListener('load', () => {
      void processReferenceImage();
    });

    referenceImage.addEventListener('error', () => {
      setReferenceStatus('Reference image failed to load.');
    });

    window.addEventListener('resize', () => {
      drawReferenceOverlay();
    });

    if (referenceImage.complete && referenceImage.naturalWidth > 0) {
      void processReferenceImage();
    }

    function scheduleNextFrame() {
      if (typeof videoElement.requestVideoFrameCallback === 'function') {
        videoElement.requestVideoFrameCallback(onVideoFrame);
        return;
      }

      requestAnimationFrame(() => {
        onVideoFrame(0, {mediaTime: videoElement.currentTime});
      });
    }

    function onVideoFrame(_now, metadata) {
      if (videoElement.readyState < 2) {
        scheduleNextFrame();
        return;
      }

      drawOverlay();

      const mediaTime = typeof metadata?.mediaTime === 'number'
        ? metadata.mediaTime
        : videoElement.currentTime;

      if (!isProcessing && mediaTime !== lastSubmittedTime) {
        lastSubmittedTime = mediaTime;
        isProcessing = true;

        faceMesh.send({image: videoElement}).catch((error) => {
          console.error(error);
          setStatus('Face mesh update failed. Check the browser console.');
        }).finally(() => {
          isProcessing = false;
        });
      }

      scheduleNextFrame();
    }

    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: {ideal: 960},
            height: {ideal: 720},
          },
        });

        videoElement.srcObject = stream;
        videoElement.autoplay = true;
        videoElement.muted = true;
        await videoElement.play();
        setStatus('Camera ready. Loading face mesh...');
        scheduleNextFrame();

        window.addEventListener('beforeunload', () => {
          stream.getTracks().forEach((track) => track.stop());
        });
      } catch (error) {
        console.error(error);
        setStatus('Camera access failed. Open this page on localhost and allow the camera.');
      }
    }

    start();
  </script>
</body>
</html>
