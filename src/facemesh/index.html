<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facemesh</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #18202a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffffff 0%, #eef3fa 58%);
    }

    .app {
      width: min(100vw, 960px);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0 0 16px;
      color: #5f6d7b;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #e8edf4;
      box-shadow: 0 20px 60px rgba(34, 52, 76, 0.14);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
    }

    canvas {
      pointer-events: none;
    }

    .status {
      margin-top: 14px;
      min-height: 24px;
      color: #5f6d7b;
      font-size: 14px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="app">
    <h1>Facemesh</h1>
    <p>Allow camera access to see the MediaPipe face mesh grid drawn on your face.</p>
    <section class="stage">
      <video class="input_video" playsinline></video>
      <canvas class="output_canvas"></canvas>
    </section>
    <div class="status" id="status">Starting camera...</div>
  </main>
  <script>
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusElement = document.getElementById('status');
    const faceMeshTesselation = typeof FACEMESH_TESSELATION !== 'undefined' ? FACEMESH_TESSELATION : [];
    const faceMeshContours = typeof FACEMESH_CONTOURS !== 'undefined' ? FACEMESH_CONTOURS : [];
    const leftEyeCenterIndex = 468;
    const rightEyeCenterIndex = 473;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function resizeCanvas() {
      const width = videoElement.videoWidth || 960;
      const height = videoElement.videoHeight || 720;
      canvasElement.width = width;
      canvasElement.height = height;
    }

    let isProcessing = false;
    let lastSubmittedTime = -1;
    let stream = null;
    let latestLandmarks = [];

    function drawEyeDot(landmarks, index) {
      const point = landmarks[index];
      if (!point) {
        return;
      }

      canvasCtx.beginPath();
      canvasCtx.arc(
        point.x * canvasElement.width,
        point.y * canvasElement.height,
        1.6,
        0,
        Math.PI * 2,
      );
      canvasCtx.fill();
    }

    function drawOverlay() {
      resizeCanvas();
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.82)';

      for (const landmarks of latestLandmarks) {
        drawConnectors(canvasCtx, landmarks, faceMeshTesselation, {
          color: '#ffffff',
          lineWidth: 0.5,
        });
        drawConnectors(canvasCtx, landmarks, faceMeshContours, {
          color: '#ffffff',
          lineWidth: 0.8,
        });
        drawEyeDot(landmarks, leftEyeCenterIndex);
        drawEyeDot(landmarks, rightEyeCenterIndex);
      }

      canvasCtx.restore();
    }

    function onResults(results) {
      latestLandmarks = results.multiFaceLandmarks || [];
      setStatus(latestLandmarks.length > 0 ? 'Face mesh active.' : 'No face detected.');
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    faceMesh.onResults(onResults);

    function scheduleNextFrame() {
      if (typeof videoElement.requestVideoFrameCallback === 'function') {
        videoElement.requestVideoFrameCallback(onVideoFrame);
        return;
      }

      requestAnimationFrame(() => {
        onVideoFrame(0, {mediaTime: videoElement.currentTime});
      });
    }

    function onVideoFrame(_now, metadata) {
      if (videoElement.readyState < 2) {
        scheduleNextFrame();
        return;
      }

      drawOverlay();

      const mediaTime = typeof metadata?.mediaTime === 'number'
        ? metadata.mediaTime
        : videoElement.currentTime;

      if (!isProcessing && mediaTime !== lastSubmittedTime) {
        lastSubmittedTime = mediaTime;
        isProcessing = true;

        faceMesh.send({image: videoElement}).catch((error) => {
          console.error(error);
          setStatus('Face mesh update failed. Check the browser console.');
        }).finally(() => {
          isProcessing = false;
        });
      }

      scheduleNextFrame();
    }

    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: {ideal: 960},
            height: {ideal: 720},
          },
        });

        videoElement.srcObject = stream;
        videoElement.autoplay = true;
        videoElement.muted = true;
        await videoElement.play();
        setStatus('Camera ready. Loading face mesh...');
        scheduleNextFrame();

        window.addEventListener('beforeunload', () => {
          stream.getTracks().forEach((track) => track.stop());
        });
      } catch (error) {
        console.error(error);
        setStatus('Camera access failed. Open this page on localhost and allow the camera.');
      }
    }

    start();
  </script>
</body>
</html>
