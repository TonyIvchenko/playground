<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facemesh</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #18202a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffffff 0%, #eef3fa 58%);
    }

    .app {
      width: min(100vw, 1180px);
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 260px;
      gap: 20px;
      align-items: start;
    }

    .viewer {
      min-width: 0;
    }

    .panel {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 14px 36px rgba(34, 52, 76, 0.10);
      backdrop-filter: blur(10px);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #334155;
    }

    .reference-viewer img,
    .reference-viewer canvas {
      transform: none;
    }

    .reference-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #e8edf4;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
    }

    .reference-stage img,
    .reference-stage canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .reference-stage canvas {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .reference-stage img {
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .reference-caption {
      margin-top: 14px;
      color: #5f6d7b;
      font-size: 13px;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0 0 16px;
      color: #5f6d7b;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #e8edf4;
      box-shadow: 0 20px 60px rgba(34, 52, 76, 0.14);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
    }

    canvas {
      pointer-events: none;
    }

    .status {
      margin-top: 14px;
      min-height: 24px;
      color: #5f6d7b;
      font-size: 14px;
    }

    @media (max-width: 840px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

      const scaleY = (ctx.canvas.clientHeight || ctx.canvas.height || 1) / (ctx.canvas.height || 1);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';

        frame.x + (point.x * frame.width),
        frame.y + (point.y * frame.height),

          frame.x + (start.x * frame.width),
          frame.y + (start.y * frame.height),

    function add3(a, b) {

    function clampMagnitude3(vector, maxMagnitude) {

    function dot3(a, b) {
      return (a.x * b.x) + (a.y * b.y) + (a.z * b.z);

    function norm3(a) {

    function normalize3(a, fallback) {

    function cross3(a, b) {
      return {
        x: (a.y * b.z) - (a.z * b.y),
        y: (a.z * b.x) - (a.x * b.z),
        z: (a.x * b.y) - (a.y * b.x),

    function toVec3(point) {
      return {x: point.x, y: point.y, z: point.z || 0};

    function getBasisFromLandmarks(landmarks) {
      if (!landmarks || landmarks.length <= Math.max(...anchorIndices)) {
        return null;
      }

      const leftCheekbone = toVec3(landmarks[anchorIndices[0]]);
      const rightCheekbone = toVec3(landmarks[anchorIndices[1]]);
      const noseTip = toVec3(landmarks[anchorIndices[2]]);
      const foreheadTop = toVec3(landmarks[anchorIndices[3]]);

      const origin = noseTip;
      const xAxis = normalize3(sub3(rightCheekbone, leftCheekbone), {x: 1, y: 0, z: 0});
      const upRaw = sub3(foreheadTop, noseTip);
      const upProjected = sub3(upRaw, mul3(xAxis, dot3(upRaw, xAxis)));
      const yAxis = normalize3(upProjected, {x: 0, y: -1, z: 0});
      const zAxis = normalize3(cross3(xAxis, yAxis), {x: 0, y: 0, z: 1});
      const scale = Math.max(1e-6, norm3(sub3(rightCheekbone, leftCheekbone)));

      return {origin, xAxis, yAxis, zAxis, scale};
    }

    function normalizeLandmarks(landmarks, basis) {
      return landmarks.map((landmark) => {
        const relative = sub3(toVec3(landmark), basis.origin);
        return {
          x: dot3(relative, basis.xAxis) / basis.scale,
          y: dot3(relative, basis.yAxis) / basis.scale,
          z: dot3(relative, basis.zAxis) / basis.scale,
        };
      });
    }

    function denormalizePoint(normalized, basis) {
      let point = basis.origin;
      point = add3(point, mul3(basis.xAxis, normalized.x * basis.scale));
      point = add3(point, mul3(basis.yAxis, normalized.y * basis.scale));
      point = add3(point, mul3(basis.zAxis, normalized.z * basis.scale));
      return point;

    function mirrorLandmarksX(landmarks) {
      return landmarks.map((point) => ({
        x: 1 - point.x,
        y: point.y,
        z: point.z || 0,

    }

    function applyRelativePose3D(
      landmarks,
      referenceBasis,
      sourceBaselineBasis,
      sourceCurrentBasis,
    ) {
      if (
        !landmarks || landmarks.length === 0
        || !referenceBasis
        || !sourceBaselineBasis
        || !sourceCurrentBasis
      ) {
        return landmarks;
      }

      const rawScale = sourceCurrentBasis.scale / Math.max(1e-6, sourceBaselineBasis.scale);
      const blendedScale = Math.max(
        unlockedScaleMin,
        Math.min(unlockedScaleMax, lerp(1.0, rawScale, unlockedScaleBlend)),
      );

      return landmarks.map((landmark) => {
        const offset = sub3(toVec3(landmark), referenceBasis.origin);
        const baselineLocal = {
          x: dot3(offset, sourceBaselineBasis.xAxis),
          y: dot3(offset, sourceBaselineBasis.yAxis),
          z: dot3(offset, sourceBaselineBasis.zAxis),
        };

        let rotated = mul3(sourceCurrentBasis.xAxis, baselineLocal.x);
        rotated = add3(rotated, mul3(sourceCurrentBasis.yAxis, baselineLocal.y));
        rotated = add3(rotated, mul3(sourceCurrentBasis.zAxis, baselineLocal.z));
        rotated = mul3(rotated, blendedScale);

        const posed = add3(sourceCurrentBasis.origin, rotated);
        return {
          x: Math.max(-0.25, Math.min(1.25, posed.x)),
          y: Math.max(-0.25, Math.min(1.25, posed.y)),
          z: posed.z,
        };

    function lerp(valueA, valueB, t) {
      return (valueA * (1 - t)) + (valueB * t);
    }

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function getEyePose(landmarks, eyeFrame) {
      const outer = landmarks[eyeFrame.outer];
      const inner = landmarks[eyeFrame.inner];
      const top = landmarks[eyeFrame.top];
      const bottom = landmarks[eyeFrame.bottom];
      if (!outer || !inner || !top || !bottom) {
        return null;
      }

      const outerPoint = toVec3(outer);
      const innerPoint = toVec3(inner);
      const topPoint = toVec3(top);
      const bottomPoint = toVec3(bottom);

      const center = mul3(
        add3(
          add3(outerPoint, innerPoint),
          add3(topPoint, bottomPoint),
        ),
        0.25,
      );

      const horizontal = normalize3(sub3(innerPoint, outerPoint), {x: 1, y: 0, z: 0});
      let verticalRaw = sub3(bottomPoint, topPoint);
      verticalRaw = sub3(verticalRaw, mul3(horizontal, dot3(verticalRaw, horizontal)));
      const vertical = normalize3(verticalRaw, {x: 0, y: 1, z: 0});
      const eyeWidth = Math.max(1e-6, norm3(sub3(innerPoint, outerPoint)));
      const eyeHeight = Math.max(0, norm3(sub3(bottomPoint, topPoint)));

      return {center, horizontal, vertical, eyeWidth, eyeHeight};

    function getEyeClosureAmount(baselineLandmarks, currentLandmarks, eyeFrame) {
      const baselinePose = getEyePose(baselineLandmarks, eyeFrame);
      const currentPose = getEyePose(currentLandmarks, eyeFrame);
      if (!baselinePose || !currentPose) {
        return 0;
      }

      const baselineOpenness = baselinePose.eyeHeight / baselinePose.eyeWidth;
      if (baselineOpenness < 1e-6) {
        return 0;
      }

      const currentOpenness = currentPose.eyeHeight / currentPose.eyeWidth;
      const opennessRatio = currentOpenness / baselineOpenness;
      const closureLinear = clamp01(1 - opennessRatio);
      return Math.pow(closureLinear, eyeClosureResponsePower);

    function normalizeEyeClosureSignal(value) {

      return clamp01((value - eyeClosureDeadzone) / Math.max(1e-6, 1 - eyeClosureDeadzone));

    function decoupleEyeClosureSignals(leftClosure, rightClosure) {
      let left = normalizeEyeClosureSignal(leftClosure);
      let right = normalizeEyeClosureSignal(rightClosure);

      const delta = Math.abs(left - right);
      if (delta <= eyeClosureSuppressionStart) {
        return {left, right};
      }

      const suppression = clamp01((delta - eyeClosureSuppressionStart) * eyeClosureSuppressionGain);
      if (left > right) {
        right *= (1 - suppression);
      } else if (right > left) {
        left *= (1 - suppression);
      }

      return {left, right};

    function applyEyeClosureWarp(point, eyePose, closure, isIrisPoint) {
      if (!eyePose || closure <= 1e-5) {
        return point;

      const offset = sub3(point, eyePose.center);
      const verticalAmount = dot3(offset, eyePose.vertical);
      const horizontalAmount = dot3(offset, eyePose.horizontal);
      const lateral = sub3(
        offset,
        add3(
          mul3(eyePose.vertical, verticalAmount),
          mul3(eyePose.horizontal, horizontalAmount),
        ),
      );

      const verticalScale = Math.max(
        0,
        1 - (closure * (isIrisPoint ? irisClosureVerticalStrength : eyeClosureVerticalStrength)),
      );
      const horizontalScale = Math.max(0.65, 1 - (closure * eyeClosureHorizontalStrength));
      const lateralScale = isIrisPoint ? Math.max(0.05, 1 - (closure * irisClosureCenterPull)) : 1.0;

      const warpedOffset = add3(
        add3(
          mul3(eyePose.vertical, verticalAmount * verticalScale),
          mul3(eyePose.horizontal, horizontalAmount * horizontalScale),
        ),
        mul3(lateral, lateralScale),
      );

      return add3(eyePose.center, warpedOffset);

    function getExpressionWeightForIndex(index) {
      if (anchorIndexSet.has(index)) {

      if (irisIndexSet.has(index)) {

      if (mouthIndexSet.has(index)) {
        return mouthRegionWeight;

      if (leftEyeIndexSet.has(index) || rightEyeIndexSet.has(index)) {

      if (leftBrowIndexSet.has(index) || rightBrowIndexSet.has(index)) {

      if (noseIndexSet.has(index)) {

    function blendPoints(previousPoints, nextPoints, factor) {
      if (!previousPoints || previousPoints.length !== nextPoints.length) {

      return nextPoints.map((point, index) => {
        const prev = previousPoints[index];
        const isEyePoint = leftEyeIndexSet.has(index) || rightEyeIndexSet.has(index) || irisIndexSet.has(index);
        const blendFactor = isEyePoint ? eyeSmoothingFactor : factor;
        return {

          y: lerp(prev.y, point.y, blendFactor),

    function buildTrianglesFromEdges(edges, pointCount) {
      const adjacency = new Map();

      for (let index = 0; index < pointCount; index += 1) {
        adjacency.set(index, new Set());
      }

      for (const [start, end] of edges) {
        if (start >= pointCount || end >= pointCount || start === end) {
          continue;
        }
        adjacency.get(start).add(end);
        adjacency.get(end).add(start);
      }

      const triangleKeys = new Set();
      const triangles = [];

      for (let a = 0; a < pointCount; a += 1) {
        const neighbors = [...adjacency.get(a)].sort((left, right) => left - right);
        for (let i = 0; i < neighbors.length; i += 1) {
          for (let j = i + 1; j < neighbors.length; j += 1) {
            const b = neighbors[i];
            const c = neighbors[j];
            if (!adjacency.get(b).has(c)) {
              continue;
            }

            const sorted = [a, b, c].sort((left, right) => left - right);
            const key = sorted.join(':');
            if (triangleKeys.has(key)) {
              continue;
            }
            triangleKeys.add(key);
            triangles.push(sorted);
          }
        }
      }

      return triangles;
    }

    function buildEyeInteriorTriangles(pointCount) {
      const triangles = [];
      const seen = new Set();

      function addTriangle(a, b, c) {
        if (
          a < 0 || b < 0 || c < 0
          || a >= pointCount || b >= pointCount || c >= pointCount
          || a === b || b === c || a === c
        ) {
          return;
        }

        const key = [a, b, c].sort((left, right) => left - right).join(':');
        if (seen.has(key)) {
          return;
        }
        seen.add(key);
        triangles.push([a, b, c]);

      function addEye(center, ring, frame) {
        const ringLength = ring.length;
        const frameLength = frame.length;

        for (let i = 0; i < ringLength; i += 1) {
          const ringCurrent = ring[i];
          const ringNext = ring[(i + 1) % ringLength];
          const frameCurrent = frame[i % frameLength];
          const frameNext = frame[(i + 1) % frameLength];

          addTriangle(center, ringCurrent, ringNext);
          addTriangle(ringCurrent, frameCurrent, frameNext);
          addTriangle(ringCurrent, frameNext, ringNext);
          addTriangle(center, frameCurrent, frameNext);
        }
      }

      addEye(468, [469, 470, 471, 472], [33, 159, 133, 145]);
      addEye(473, [474, 475, 476, 477], [362, 386, 263, 374]);

      return triangles;
    }

    function mergeTriangles(primaryTriangles, extraTriangles) {
      const merged = [];
      const seen = new Set();

      function add(triangle) {
        const [a, b, c] = triangle;
        const key = [a, b, c].sort((left, right) => left - right).join(':');
        if (seen.has(key)) {
          return;
        }
        seen.add(key);
        merged.push(triangle);
      }

      for (const triangle of primaryTriangles) {
        add(triangle);
      }
      for (const triangle of extraTriangles) {
        add(triangle);
      }

      return merged;

    function isEyeRelatedIndex(index) {

    function shouldWarpTriangle(triangle) {

    function drawEyePatchTransformed(
      ctx,
      sourceCanvas,
      sourcePoints,
      destinationPoints,
      outerIndex,
      innerIndex,
      topIndex,
      bottomIndex,
    ) {
      const srcOuter = sourcePoints[outerIndex];
      const srcInner = sourcePoints[innerIndex];
      const srcTop = sourcePoints[topIndex];
      const srcBottom = sourcePoints[bottomIndex];
      const dstOuter = destinationPoints[outerIndex];
      const dstInner = destinationPoints[innerIndex];
      const dstTop = destinationPoints[topIndex];
      const dstBottom = destinationPoints[bottomIndex];

      if (
        !srcOuter || !srcInner || !srcTop || !srcBottom
        || !dstOuter || !dstInner || !dstTop || !dstBottom
      ) {
        return;
      }

      const srcCenterX = (srcOuter.x + srcInner.x) * 0.5;
      const srcCenterY = (srcOuter.y + srcInner.y) * 0.5;
      const dstCenterX = (dstOuter.x + dstInner.x) * 0.5;
      const dstCenterY = (dstOuter.y + dstInner.y) * 0.5;
      const deltaX = dstCenterX - srcCenterX;
      const deltaY = dstCenterY - srcCenterY;
      const radiusX = Math.max(2, Math.hypot(srcInner.x - srcOuter.x, srcInner.y - srcOuter.y) * 0.62);
      const radiusY = Math.max(2, Math.hypot(srcBottom.x - srcTop.x, srcBottom.y - srcTop.y) * 0.95);
      const rotation = Math.atan2(srcInner.y - srcOuter.y, srcInner.x - srcOuter.x);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(dstCenterX, dstCenterY, radiusX, radiusY, rotation, 0, Math.PI * 2);
      ctx.clip();
      ctx.setTransform(1, 0, 0, 1, deltaX, deltaY);
      ctx.drawImage(sourceCanvas, 0, 0);
      ctx.restore();
    }

    function drawStaticEyeBackground(ctx, sourceCanvas, sourcePoints, destinationPoints) {
      drawEyePatchTransformed(ctx, sourceCanvas, sourcePoints, destinationPoints, 33, 133, 159, 145);
      drawEyePatchTransformed(ctx, sourceCanvas, sourcePoints, destinationPoints, 263, 362, 386, 374);
    }

    function buildNeighborMapFromTriangles(triangles, pointCount) {
      const neighbors = Array.from({length: pointCount}, () => new Set());

      for (const [a, b, c] of triangles) {
        if (a >= pointCount || b >= pointCount || c >= pointCount) {
          continue;
        }
        neighbors[a].add(b);
        neighbors[a].add(c);
        neighbors[b].add(a);
        neighbors[b].add(c);
        neighbors[c].add(a);
        neighbors[c].add(b);
      }

      return neighbors.map((neighborSet) => [...neighborSet]);
    }

    function buildBoundaryFalloffWeights(neighborMap, pointCount, boundaryIndexSet, rampHops, power) {
      const distances = Array(pointCount).fill(Infinity);
      const queue = [];

      for (const index of boundaryIndexSet) {
        if (index < 0 || index >= pointCount) {
          continue;
        }
        distances[index] = 0;
        queue.push(index);
      }

      let cursor = 0;
      while (cursor < queue.length) {
        const current = queue[cursor];
        cursor += 1;
        const currentDistance = distances[current];
        const neighbors = neighborMap[current] || [];

        for (const neighbor of neighbors) {
          if (neighbor < 0 || neighbor >= pointCount) {
            continue;
          }
          const nextDistance = currentDistance + 1;
          if (nextDistance < distances[neighbor]) {
            distances[neighbor] = nextDistance;
            queue.push(neighbor);
          }
        }
      }

      return distances.map((distance) => {
        if (!Number.isFinite(distance)) {
          return 1.0;
        }
        const linear = Math.min(1, distance / Math.max(1, rampHops));
        return Math.pow(linear, power);
      });
    }

    function spatialSmoothPoints(points, neighborMap, blend, passes) {
      if (!points || points.length === 0 || !neighborMap || neighborMap.length === 0) {
        return points;
      }

      let current = points.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));

      for (let pass = 0; pass < passes; pass += 1) {
        const next = current.map((point, index) => {
          if (
            anchorIndexSet.has(index)
            || faceOvalIndexSet.has(index)
            || irisIndexSet.has(index)
            || leftEyeIndexSet.has(index)
            || rightEyeIndexSet.has(index)
          ) {
            return point;
          }

          const neighbors = neighborMap[index] || [];
          if (neighbors.length === 0) {
            return point;
          }

          let sumX = 0;
          let sumY = 0;
          let sumZ = 0;
          let count = 0;

          for (const neighborIndex of neighbors) {
            const neighbor = current[neighborIndex];
            if (!neighbor) {
              continue;
            }
            sumX += neighbor.x;
            sumY += neighbor.y;
            sumZ += neighbor.z || 0;
            count += 1;
          }

          if (count === 0) {
            return point;
          }

          const invCount = 1 / count;
          return {
            x: lerp(point.x, sumX * invCount, blend),
            y: lerp(point.y, sumY * invCount, blend),
            z: lerp(point.z || 0, sumZ * invCount, blend),
          };
        });

        current = next;
      }

      return current;
    }

    function triangleArea(pointA, pointB, pointC) {
      return Math.abs(
        (pointA.x * (pointB.y - pointC.y))
        + (pointB.x * (pointC.y - pointA.y))
        + (pointC.x * (pointA.y - pointB.y)),
      ) * 0.5;
    }

    function affineFromTriangles(srcA, srcB, srcC, dstA, dstB, dstC) {
      const denominator =
        (srcA.x * (srcB.y - srcC.y))
        + (srcB.x * (srcC.y - srcA.y))
        + (srcC.x * (srcA.y - srcB.y));

      if (Math.abs(denominator) < 1e-8) {
        return null;
      }

      const a = (
        (dstA.x * (srcB.y - srcC.y))
        + (dstB.x * (srcC.y - srcA.y))
        + (dstC.x * (srcA.y - srcB.y))
      ) / denominator;

      const c = (
        (dstA.x * (srcC.x - srcB.x))
        + (dstB.x * (srcA.x - srcC.x))
        + (dstC.x * (srcB.x - srcA.x))
      ) / denominator;

      const e = (
        (dstA.x * ((srcB.x * srcC.y) - (srcC.x * srcB.y)))
        + (dstB.x * ((srcC.x * srcA.y) - (srcA.x * srcC.y)))
        + (dstC.x * ((srcA.x * srcB.y) - (srcB.x * srcA.y)))
      ) / denominator;

      const b = (
        (dstA.y * (srcB.y - srcC.y))
        + (dstB.y * (srcC.y - srcA.y))
        + (dstC.y * (srcA.y - srcB.y))
      ) / denominator;

      const d = (
        (dstA.y * (srcC.x - srcB.x))
        + (dstB.y * (srcA.x - srcC.x))
        + (dstC.y * (srcB.x - srcA.x))
      ) / denominator;

      const f = (
        (dstA.y * ((srcB.x * srcC.y) - (srcC.x * srcB.y)))
        + (dstB.y * ((srcC.x * srcA.y) - (srcA.x * srcC.y)))
        + (dstC.y * ((srcA.x * srcB.y) - (srcB.x * srcA.y)))
      ) / denominator;

      return {a, b, c, d, e, f};
    }

    function warpReferenceByTriangles(sourceCanvas, destinationCtx, sourcePoints, destinationPoints, triangles, clearBefore = true) {
      if (clearBefore) {
        destinationCtx.clearRect(0, 0, destinationCtx.canvas.width, destinationCtx.canvas.height);
      }

      const trianglesToDraw = [];

      for (const [indexA, indexB, indexC] of triangles) {
        const srcA = sourcePoints[indexA];
        const srcB = sourcePoints[indexB];
        const srcC = sourcePoints[indexC];
        const dstA = destinationPoints[indexA];
        const dstB = destinationPoints[indexB];
        const dstC = destinationPoints[indexC];

        if (!srcA || !srcB || !srcC || !dstA || !dstB || !dstC) {
          continue;
        }

        if (triangleArea(dstA, dstB, dstC) < 0.5 || triangleArea(srcA, srcB, srcC) < 0.5) {
          continue;
        }

        const matrix = affineFromTriangles(srcA, srcB, srcC, dstA, dstB, dstC);
        if (!matrix) {
          continue;
        }

        const centerZ = ((dstA.z || 0) + (dstB.z || 0) + (dstC.z || 0)) / 3;
        trianglesToDraw.push({
          matrix,
          dstA,
          dstB,
          dstC,
          centerZ,
        });
      }

      // Painter's algorithm: draw farther triangles first, then nearer on top.
      trianglesToDraw.sort((left, right) => right.centerZ - left.centerZ);

      for (const triangle of trianglesToDraw) {
        const {matrix, dstA, dstB, dstC} = triangle;

        destinationCtx.save();
        destinationCtx.beginPath();
        destinationCtx.moveTo(dstA.x, dstA.y);
        destinationCtx.lineTo(dstB.x, dstB.y);
        destinationCtx.lineTo(dstC.x, dstC.y);
        destinationCtx.closePath();
        destinationCtx.clip();

        destinationCtx.setTransform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
        destinationCtx.drawImage(sourceCanvas, 0, 0);
        destinationCtx.restore();
      }
    }

    function getContainFrame(containerWidth, containerHeight, sourceWidth, sourceHeight) {
      const scale = Math.min(containerWidth / sourceWidth, containerHeight / sourceHeight);
      const width = sourceWidth * scale;
      const height = sourceHeight * scale;
      return {
        x: (containerWidth - width) / 2,
        y: (containerHeight - height) / 2,
        width,
        height,
      };
    }

    function drawOverlay() {
      resizeCanvas();
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      drawMesh(canvasCtx, canvasElement.width, canvasElement.height, latestLandmarks);
      canvasCtx.restore();
    }

    function drawReferenceOverlay() {
      resizeReferenceCanvas();
      if (!referenceImage.complete || referenceImage.naturalWidth === 0 || referenceImage.naturalHeight === 0) {
        referenceCtx.clearRect(0, 0, referenceCanvas.width, referenceCanvas.height);
        return;
      }

      const frame = getContainFrame(
        referenceCanvas.width,
        referenceCanvas.height,
        referenceImage.naturalWidth,
        referenceImage.naturalHeight,
      );

      referenceCtx.imageSmoothingEnabled = true;
      referenceCtx.imageSmoothingQuality = 'high';

      referenceSourceCanvas.width = referenceCanvas.width;
      referenceSourceCanvas.height = referenceCanvas.height;
      referenceSourceCtx.clearRect(0, 0, referenceSourceCanvas.width, referenceSourceCanvas.height);
      referenceSourceCtx.drawImage(referenceImage, frame.x, frame.y, frame.width, frame.height);

      const activeLandmarks = computeTransferredReferenceLandmarks();
      const sourcePoints = referenceBaseLandmarks.map((landmark) => ({
        x: frame.x + (landmark.x * frame.width),
        y: frame.y + (landmark.y * frame.height),
        z: landmark.z || 0,
      }));
      const destinationPoints = activeLandmarks.map((landmark) => ({
        x: frame.x + (landmark.x * frame.width),
        y: frame.y + (landmark.y * frame.height),
        z: landmark.z || 0,
      }));

      const lockFace = lockFaceInput.checked;
      const warpTriangles = lockFace
        ? (referenceWarpTriangles.length > 0 ? referenceWarpTriangles : referenceTriangles)
        : referenceTriangles;
      if (warpTriangles.length === 0 || sourcePoints.length === 0 || destinationPoints.length === 0) {
        referenceCtx.clearRect(0, 0, referenceCanvas.width, referenceCanvas.height);
        if (lockFace) {
          referenceCtx.drawImage(referenceSourceCanvas, 0, 0);
        }
      } else {
        if (lockFace) {
          referenceCtx.clearRect(0, 0, referenceCanvas.width, referenceCanvas.height);
          referenceCtx.drawImage(referenceSourceCanvas, 0, 0);
          drawStaticEyeBackground(referenceCtx, referenceSourceCanvas, sourcePoints, destinationPoints);
          warpReferenceByTriangles(
            referenceSourceCanvas,
            referenceCtx,
            sourcePoints,
            destinationPoints,
            warpTriangles,
            false,
          );
        } else {
          referenceCtx.clearRect(0, 0, referenceCanvas.width, referenceCanvas.height);
          warpReferenceByTriangles(
            referenceSourceCanvas,
            referenceCtx,
            sourcePoints,
            destinationPoints,
            warpTriangles,
            false,
          );
        }
      }

      latestTransferredReferenceLandmarks = [activeLandmarks];
      drawMesh(referenceCtx, referenceCanvas.width, referenceCanvas.height, latestTransferredReferenceLandmarks, frame);
    }

    function computeTransferredReferenceLandmarks() {
      if (referenceBaseLandmarks.length === 0) {
        smoothedReferencePoints = referenceBaseLandmarks.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));
        return smoothedReferencePoints;
      }

      if (cameraBaselineLandmarks.length === 0 || cameraCurrentLandmarks.length === 0) {
        smoothedReferencePoints = referenceBaseLandmarks.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));
        return smoothedReferencePoints;
      }

      const referenceBasis = getBasisFromLandmarks(referenceBaseLandmarks);
      const cameraBaselineBasis = getBasisFromLandmarks(cameraBaselineLandmarks);
      const cameraCurrentBasis = getBasisFromLandmarks(cameraCurrentLandmarks);

      if (!referenceBasis || !cameraBaselineBasis || !cameraCurrentBasis) {
        smoothedReferencePoints = referenceBaseLandmarks.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));
        return smoothedReferencePoints;
      }

      const referenceNormalized = normalizeLandmarks(referenceBaseLandmarks, referenceBasis);
      const cameraBaselineNormalized = normalizeLandmarks(cameraBaselineLandmarks, cameraBaselineBasis);
      const cameraCurrentNormalized = normalizeLandmarks(cameraCurrentLandmarks, cameraCurrentBasis);
      const rawLeftEyeClosure = getEyeClosureAmount(cameraBaselineNormalized, cameraCurrentNormalized, leftEyeFrame);
      const rawRightEyeClosure = getEyeClosureAmount(cameraBaselineNormalized, cameraCurrentNormalized, rightEyeFrame);
      const closureSignals = decoupleEyeClosureSignals(rawLeftEyeClosure, rawRightEyeClosure);
      const leftEyeClosure = closureSignals.left;
      const rightEyeClosure = closureSignals.right;
      const referenceLeftEyePose = getEyePose(referenceNormalized, leftEyeFrame);
      const referenceRightEyePose = getEyePose(referenceNormalized, rightEyeFrame);

      const transferred = referenceNormalized.map((referencePoint, index) => {
        const baselinePoint = cameraBaselineNormalized[index];
        const currentPoint = cameraCurrentNormalized[index];
        if (!baselinePoint || !currentPoint) {
          return {x: referenceBaseLandmarks[index].x, y: referenceBaseLandmarks[index].y, z: referenceBaseLandmarks[index].z || 0};
        }
        const regionWeight = getExpressionWeightForIndex(index);
        const boundaryWeight = boundaryFalloffWeights[index] ?? 1.0;
        const combinedWeight = regionWeight * boundaryWeight;

        const rawExpressionDelta = {
          x: (currentPoint.x - baselinePoint.x) * expressionGain * combinedWeight,
          y: (currentPoint.y - baselinePoint.y) * expressionGain * combinedWeight,
          z: (currentPoint.z - baselinePoint.z) * expressionGain * combinedWeight,
        };
        const isEyePoint = leftEyeIndexSet.has(index) || rightEyeIndexSet.has(index) || irisIndexSet.has(index);
        const expressionDelta = clampMagnitude3(
          rawExpressionDelta,
          isEyePoint ? eyeClosureMaxDisplacementNormalized : maxExpressionDisplacementNormalized,
        );

        let targetNormalized = {
          x: referencePoint.x + expressionDelta.x,
          y: referencePoint.y + expressionDelta.y,
          z: referencePoint.z + expressionDelta.z,
        };

        if (leftEyeIndexSet.has(index) || leftIrisIndexSet.has(index)) {
          const warped = applyEyeClosureWarp(
            toVec3(targetNormalized),
            referenceLeftEyePose,
            leftEyeClosure,
            leftIrisIndexSet.has(index),
          );
          targetNormalized = {x: warped.x, y: warped.y, z: warped.z};
        } else if (rightEyeIndexSet.has(index) || rightIrisIndexSet.has(index)) {
          const warped = applyEyeClosureWarp(
            toVec3(targetNormalized),
            referenceRightEyePose,
            rightEyeClosure,
            rightIrisIndexSet.has(index),
          );
          targetNormalized = {x: warped.x, y: warped.y, z: warped.z};
        }

        const world = denormalizePoint(targetNormalized, referenceBasis);
        return {
          x: Math.min(1, Math.max(0, world.x)),
          y: Math.min(1, Math.max(0, world.y)),
          z: world.z,
        };
      });

      const temporallySmoothed = blendPoints(smoothedReferencePoints, transferred, smoothingFactor).map((point, index) => ({
        x: point.x,
        y: point.y,
        z: transferred[index].z,
      }));
      smoothedReferencePoints = spatialSmoothPoints(
        temporallySmoothed,
        referenceNeighborMap,
        spatialSmoothingBlend,
        spatialSmoothingPasses,
      );
      if (lockFaceInput.checked) {
        return smoothedReferencePoints;
      }

      const mirroredBaselineLandmarks = mirrorLandmarksX(cameraBaselineLandmarks);
      const mirroredCurrentLandmarks = mirrorLandmarksX(cameraCurrentLandmarks);
      if (mirroredBaselineLandmarks.length === 0 || mirroredCurrentLandmarks.length === 0) {
        return smoothedReferencePoints;
      }
      const mirroredBaselineBasis = getBasisFromLandmarks(mirroredBaselineLandmarks);
      const mirroredCurrentBasis = getBasisFromLandmarks(mirroredCurrentLandmarks);
      if (!mirroredBaselineBasis || !mirroredCurrentBasis) {
        return smoothedReferencePoints;
      }

      return applyRelativePose3D(
        smoothedReferencePoints,
        referenceBasis,
        mirroredBaselineBasis,
        mirroredCurrentBasis,
      );
    }

    function onResults(results) {
      latestLandmarks = results.multiFaceLandmarks || [];
      cameraCurrentLandmarks = latestLandmarks[0] || [];

      if (cameraCurrentLandmarks.length > 0 && cameraBaselineLandmarks.length === 0) {
        cameraBaselineLandmarks = cameraCurrentLandmarks.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));
        setStatus('Face mesh active. Baseline captured.');
        return;
      }

      setStatus(latestLandmarks.length > 0 ? 'Face mesh active.' : 'No face detected.');
    }

    function createFaceMesh(onResultsHandler, options = {}) {
      const mesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
      });

      mesh.setOptions({
        maxNumFaces: options.maxNumFaces ?? 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      mesh.onResults(onResultsHandler);
      return mesh;
    }

    function onReferenceResults(results) {
      latestReferenceLandmarks = results.multiFaceLandmarks || [];
      referenceBaseLandmarks = latestReferenceLandmarks[0] || [];
      smoothedReferencePoints = referenceBaseLandmarks.map((point) => ({x: point.x, y: point.y, z: point.z || 0}));

      if (referenceBaseLandmarks.length > 0) {
        const baseTriangles = buildTrianglesFromEdges(faceMeshTesselation, referenceBaseLandmarks.length);
        const eyeInteriorTriangles = buildEyeInteriorTriangles(referenceBaseLandmarks.length);
        referenceTriangles = mergeTriangles(baseTriangles, eyeInteriorTriangles);
        referenceWarpTriangles = referenceTriangles.filter(shouldWarpTriangle);
        referenceNeighborMap = buildNeighborMapFromTriangles(referenceTriangles, referenceBaseLandmarks.length);
        boundaryFalloffWeights = buildBoundaryFalloffWeights(
          referenceNeighborMap,
          referenceBaseLandmarks.length,
          faceOvalIndexSet,
          boundaryRampHops,
          boundaryWeightPower,
        );
      } else {
        referenceTriangles = [];
        referenceWarpTriangles = [];
        referenceNeighborMap = [];
        boundaryFalloffWeights = [];
      }

      drawReferenceOverlay();
      setReferenceStatus(referenceBaseLandmarks.length > 0 ? 'Reference mesh ready.' : 'No face detected in reference image.');
    }

    showMeshInput.addEventListener('change', () => {
      drawOverlay();
      drawReferenceOverlay();
    });

    lockFaceInput.addEventListener('change', () => {
      drawReferenceOverlay();
    });

    async function processReferenceImage() {
      resizeReferenceCanvas();
      drawReferenceOverlay();
      setReferenceStatus('Detecting reference mesh...');
      const referenceFaceMesh = createFaceMesh(onReferenceResults, {maxNumFaces: 2});
      try {
        await referenceFaceMesh.send({image: referenceImage});
      } catch (error) {
        console.error(error);
        setReferenceStatus('Reference image mesh failed. Check the browser console.');
      } finally {
        if (typeof referenceFaceMesh.close === 'function') {
          await referenceFaceMesh.close().catch((closeError) => {
            console.warn(closeError);
          });
        }
      }
    }

    window.addEventListener('resize', () => {
      drawReferenceOverlay();
    });

    async function waitForReferenceImage() {
      if (referenceImage.complete) {
        if (referenceImage.naturalWidth === 0) {
          setReferenceStatus('Reference image failed to load.');
        }
        return;
      }

      await new Promise((resolve) => {
        const onLoad = () => {
          cleanup();
          resolve();
        };

        const onError = () => {
          setReferenceStatus('Reference image failed to load.');
          cleanup();
          resolve();
        };

        const cleanup = () => {
          referenceImage.removeEventListener('load', onLoad);
          referenceImage.removeEventListener('error', onError);
        };

        referenceImage.addEventListener('load', onLoad);
        referenceImage.addEventListener('error', onError);
      });
    }

    function scheduleNextFrame() {
      if (typeof videoElement.requestVideoFrameCallback === 'function') {
        videoElement.requestVideoFrameCallback(onVideoFrame);
        return;
      }

      requestAnimationFrame(() => {
        onVideoFrame(0, {mediaTime: videoElement.currentTime});
      });
    }

    function onVideoFrame(_now, metadata) {
      if (videoElement.readyState < 2) {
        scheduleNextFrame();
        return;
      }

      drawOverlay();
      drawReferenceOverlay();

      const mediaTime = typeof metadata?.mediaTime === 'number'
        ? metadata.mediaTime
        : videoElement.currentTime;

      if (!isProcessing && mediaTime !== lastSubmittedTime && faceMesh) {
        lastSubmittedTime = mediaTime;
        isProcessing = true;

        faceMesh.send({image: videoElement}).catch((error) => {
          console.error(error);
          setStatus('Face mesh update failed. Check the browser console.');
        }).finally(() => {
          isProcessing = false;
        });
      }

      scheduleNextFrame();
    }

    async function start() {
      try {
        faceMesh = createFaceMesh(onResults);
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: {ideal: 960},
            height: {ideal: 720},
          },
        });

        videoElement.srcObject = stream;
        videoElement.autoplay = true;
        videoElement.muted = true;
        await videoElement.play();
        setStatus('Camera ready. Loading face mesh...');
        scheduleNextFrame();

        window.addEventListener('beforeunload', () => {
          stream.getTracks().forEach((track) => track.stop());
        });
      } catch (error) {
        console.error(error);
        setStatus('Camera access failed. Open this page on localhost and allow the camera.');
      }
    }

    async function bootstrap() {
      await waitForReferenceImage();
      if (referenceImage.naturalWidth > 0) {
        await processReferenceImage();
      }
      await start();
    }

    void bootstrap();
  </script>
</body>
</html>
