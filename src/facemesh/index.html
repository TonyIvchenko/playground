<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facemesh</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #101418;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1c2733 0%, #101418 55%);
    }

    .app {
      width: min(100vw, 960px);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0 0 16px;
      color: #b3bfcb;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #0a0d10;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      opacity: 0;
      pointer-events: none;
    }

    .status {
      margin-top: 14px;
      min-height: 24px;
      color: #b3bfcb;
      font-size: 14px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="app">
    <h1>Facemesh</h1>
    <p>Allow camera access to see the MediaPipe face mesh grid drawn on your face.</p>
    <section class="stage">
      <video class="input_video" playsinline></video>
      <canvas class="output_canvas"></canvas>
    </section>
    <div class="status" id="status">Starting camera...</div>
  </main>
  <script>
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusElement = document.getElementById('status');

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function resizeCanvas() {
      const width = videoElement.videoWidth || 960;
      const height = videoElement.videoHeight || 720;
      canvasElement.width = width;
      canvasElement.height = height;
    }

    function onResults(results) {
      resizeCanvas();
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {
            color: '#36d7ff',
            lineWidth: 0.8,
          });
          drawConnectors(canvasCtx, landmarks, FACEMESH_CONTOURS, {
            color: '#8dff8a',
            lineWidth: 1.2,
          });
          drawConnectors(canvasCtx, landmarks, FACEMESH_IRISES, {
            color: '#ffb347',
            lineWidth: 1.4,
          });
        }
        setStatus('Face mesh active.');
      } else {
        setStatus('No face detected.');
      }

      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 960,
      height: 720,
    });

    camera.start().catch((error) => {
      console.error(error);
      setStatus('Camera access failed. Open this page on localhost and allow the camera.');
    });
  </script>
</body>
</html>
