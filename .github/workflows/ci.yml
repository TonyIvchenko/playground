name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            environment.yml
            pytest.ini
            requirements.txt
            src/test/requirements.txt
            src/disasters/requirements.txt
            src/ctscan/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r src/test/requirements.txt \
            -r src/disasters/requirements.txt \
            -r src/ctscan/requirements.txt \
            pytest

      - name: Validate dependency graph
        run: pip check

      - name: Collect tests
        run: python -m pytest -q --collect-only

  service-tests:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            path: src/test/tests
          - name: disasters
            path: src/disasters/tests
          - name: ctscan
            path: src/ctscan/tests
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            environment.yml
            pytest.ini
            requirements.txt
            src/test/requirements.txt
            src/disasters/requirements.txt
            src/ctscan/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r src/test/requirements.txt \
            -r src/disasters/requirements.txt \
            -r src/ctscan/requirements.txt \
            pytest

      - name: Run ${{ matrix.name }} tests
        run: python -m pytest -q ${{ matrix.path }}
