name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: tests-collect
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-playground-python

      - name: Validate dependency graph
        run: python -m pip check

      - name: Collect tests
        run: python -m pytest -q --collect-only

  service-tests:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            path: src/test/tests
          - name: disasters
            path: src/disasters/tests
          - name: ctscan
            path: src/ctscan/tests
    name: tests-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-playground-python

      - name: Run ${{ matrix.name }} tests
        run: python -m pytest -q ${{ matrix.path }}

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: disasters
            dockerfile: src/disasters/Dockerfile
            port: 18080
          - name: ctscan
            dockerfile: src/ctscan/Dockerfile
            port: 18081
    name: smoke-web-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: ./.github/actions/build-playground-image
        with:
          dockerfile: ${{ matrix.dockerfile }}
          image: playground-${{ matrix.name }}

      - name: Start ${{ matrix.name }} container
        run: docker run --detach --rm --init --name playground-${{ matrix.name }} -p ${{ matrix.port }}:8080 playground-${{ matrix.name }}

      - name: Wait for ${{ matrix.name }} health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' playground-${{ matrix.name }} 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent --show-error "http://127.0.0.1:${{ matrix.port }}/health" > /tmp/${{ matrix.name }}-health.json
              cat /tmp/${{ matrix.name }}-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs playground-${{ matrix.name }}
          exit 1

      - name: Show ${{ matrix.name }} container logs
        if: failure()
        run: docker logs playground-${{ matrix.name }} || true

      - name: Stop ${{ matrix.name }} container
        if: always()
        run: docker rm --force playground-${{ matrix.name }} || true

  test-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: smoke-redis-test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        uses: ./.github/actions/build-playground-image
        with:
          dockerfile: src/test/Dockerfile
          image: playground-test

      - name: Start test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --init --network host \
            --name playground-test \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e REDIS_KEY=ci-smoke \
            -e REDIS_VALUE=healthy \
            -e SLEEP_SECONDS=1 \
            playground-test

      - name: Wait for Redis write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import socket
          import time

          command = b"*2\r\n$3\r\nGET\r\n$8\r\nci-smoke\r\n"
          expected = b"$7\r\nhealthy\r\n"

          for _ in range(30):
              try:
                  status = subprocess.check_output(
                      [
                          "docker",
                          "inspect",
                          "--format",
                          "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}",
                          "playground-test",
                      ],
                      text=True,
                  ).strip()
                  if status != "healthy":
                      time.sleep(2)
                      continue
                  with socket.create_connection(("127.0.0.1", 6379), timeout=2) as sock:
                      sock.sendall(command)
                      payload = sock.recv(4096)
                  if expected in payload:
                      print(payload.decode("utf-8", errors="ignore"))
                      raise SystemExit(0)
              except (OSError, subprocess.CalledProcessError):
                  pass
              time.sleep(2)

          raise SystemExit(1)
          PY

      - name: Show test container logs
        if: failure()
        run: docker logs playground-test || true

      - name: Stop test container
        if: always()
        run: docker rm --force playground-test || true
