name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"
  WEB_HEALTH_RETRIES: "30"
  WEB_HEALTH_WAIT_SECONDS: "2"
  REDIS_SMOKE_RETRIES: "30"
  REDIS_SMOKE_WAIT_SECONDS: "2"
  REDIS_SMOKE_HOST: "127.0.0.1"
  REDIS_SMOKE_PORT: "6379"
  REDIS_SMOKE_KEY: "ci-smoke"
  REDIS_SMOKE_VALUE: "healthy"
  REDIS_SMOKE_SLEEP_SECONDS: "1"
  REDIS_SOCKET_CONNECT_TIMEOUT: "5"
  REDIS_SOCKET_TIMEOUT: "5"
  REDIS_BACKOFF_INITIAL_SECONDS: "1"
  REDIS_BACKOFF_MAX_SECONDS: "60"
  REDIS_BACKOFF_MULTIPLIER: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: changes
    outputs:
      docs: ${{ steps.manual.outputs.docs || steps.filter.outputs.docs }}
      config: ${{ steps.manual.outputs.config || steps.filter.outputs.config }}
      shared_ci: ${{ steps.manual.outputs.shared_ci || steps.filter.outputs.shared_ci }}
      static_apps: ${{ steps.manual.outputs.static_apps || steps.filter.outputs.static_apps }}
      test_service: ${{ steps.manual.outputs.test_service || steps.filter.outputs.test_service }}
      disasters: ${{ steps.manual.outputs.disasters || steps.filter.outputs.disasters }}
      ctscan: ${{ steps.manual.outputs.ctscan || steps.filter.outputs.ctscan }}
      voiceforge: ${{ steps.manual.outputs.voiceforge || steps.filter.outputs.voiceforge }}
    steps:
      - name: Mark all filters matched for manual runs
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: bash
        run: |
          set -euo pipefail
          for key in docs config shared_ci static_apps test_service disasters ctscan voiceforge; do
            echo "$key=true" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '*.md'
              - 'src/**/README.md'
              - 'scripts/check_readme_code_paths.py'
              - 'scripts/check_markdown_readmes.py'
              - 'scripts/check_docs_spelling.py'
              - 'scripts/check_docker_smoke_docs.py'
            config:
              - '.github/**/*.yml'
              - '.github/**/*.yaml'
              - 'environment.yml'
              - '.vscode/**/*.json'
              - 'src/disasters/tiles/*/overlay.json'
              - 'scripts/check_json_yaml_configs.py'
            shared_ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'pytest.ini'
              - 'requirements.txt'
              - 'environment.yml'
              - 'scripts/poll_http_health.py'
              - 'scripts/run_ml_smoke_jobs.py'
              - 'scripts/check_service_local_run.py'
            static_apps:
              - 'tests/test_static_app_smokes.py'
              - 'scripts/poll_http_health.py'
              - 'scripts/smoke_service.py'
              - 'src/bert/**'
              - 'src/counterpoint/**'
              - 'src/debate/**'
              - 'src/facemesh/**'
              - 'src/manipulation/**'
              - 'src/memorypalace/**'
              - 'src/realitycheck/**'
              - 'src/realitymix/**'
              - 'src/vibedj/**'
            test_service:
              - 'src/test/**'
            disasters:
              - 'src/disasters/**'
            ctscan:
              - 'src/ctscan/**'
            voiceforge:
              - 'src/voiceforge/**'

  collect:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared_ci == 'true' ||
      needs.changes.outputs.static_apps == 'true' ||
      needs.changes.outputs.test_service == 'true' ||
      needs.changes.outputs.disasters == 'true' ||
      needs.changes.outputs.ctscan == 'true' ||
      needs.changes.outputs.voiceforge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: tests-collect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-playground-python

      - name: Validate dependency graph
        shell: bash
        run: python -m pip check

      - name: Collect tests
        shell: bash
        run: python -m pytest -q --collect-only

  readme-code-paths:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.shared_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: docs-readme-code-paths
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README code block paths
        shell: bash
        run: python scripts/check_readme_code_paths.py

  readme-markdown:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.shared_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: docs-readme-markdown
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint README markdown consistency
        shell: bash
        run: python scripts/check_markdown_readmes.py

  docs-spelling:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.shared_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: docs-spelling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs spelling
        shell: bash
        run: python scripts/check_docs_spelling.py

  docker-smoke-docs:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ctscan == 'true' ||
      needs.changes.outputs.disasters == 'true' ||
      needs.changes.outputs.test_service == 'true' ||
      needs.changes.outputs.voiceforge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: docs-docker-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documented Docker smoke commands
        shell: bash
        run: python scripts/check_docker_smoke_docs.py

  config-json-yaml:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.shared_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: config-json-yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint JSON and YAML configs
        shell: bash
        run: python scripts/check_json_yaml_configs.py

  tracked-junk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: tracked-junk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked junk files
        shell: bash
        run: python scripts/check_tracked_junk.py

  readme-local-run:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared_ci == 'true' ||
      needs.changes.outputs.static_apps == 'true' ||
      needs.changes.outputs.test_service == 'true' ||
      needs.changes.outputs.disasters == 'true' ||
      needs.changes.outputs.ctscan == 'true' ||
      needs.changes.outputs.voiceforge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bert
            port: 18100
          - service: counterpoint
            port: 18101
          - service: ctscan
            port: 18102
          - service: debate
            port: 18103
          - service: disasters
            port: 18104
          - service: facemesh
            port: 18105
          - service: manipulation
            port: 18106
          - service: memorypalace
            port: 18107
          - service: realitycheck
            port: 18108
          - service: realitymix
            port: 18109
          - service: test
            port: 18110
          - service: vibedj
            port: 18111
          - service: voiceforge
            port: 18112
    name: local-run-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-playground-python

      - name: Check ${{ matrix.service }} README Local Run
        shell: bash
        run: python scripts/check_service_local_run.py --service ${{ matrix.service }} --port ${{ matrix.port }}

  service-tests:
    needs:
      - changes
      - collect
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared_ci == 'true' ||
      (matrix.name == 'static-apps' && needs.changes.outputs.static_apps == 'true') ||
      (matrix.name == 'test' && needs.changes.outputs.test_service == 'true') ||
      (matrix.name == 'disasters' && needs.changes.outputs.disasters == 'true') ||
      (matrix.name == 'ctscan' && needs.changes.outputs.ctscan == 'true') ||
      (matrix.name == 'voiceforge' && needs.changes.outputs.voiceforge == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static-apps
            path: tests/test_static_app_smokes.py
          - name: test
            path: src/test/tests
          - name: disasters
            path: src/disasters/tests
          - name: ctscan
            path: src/ctscan/tests
          - name: voiceforge
            path: src/voiceforge/tests
    name: tests-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-playground-python

      - name: Run ${{ matrix.name }} tests
        shell: bash
        run: python -m pytest -q ${{ matrix.path }}

  container-smoke:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared_ci == 'true' ||
      (matrix.name == 'disasters' && needs.changes.outputs.disasters == 'true') ||
      (matrix.name == 'ctscan' && needs.changes.outputs.ctscan == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: disasters
            dockerfile: src/disasters/Dockerfile
            port: 18080
          - name: ctscan
            dockerfile: src/ctscan/Dockerfile
            port: 18081
    name: smoke-web-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: ./.github/actions/build-playground-image
        with:
          dockerfile: ${{ matrix.dockerfile }}
          image: playground-${{ matrix.name }}

      - name: Start ${{ matrix.name }} container
        shell: bash
        run: docker run --detach --rm --init --name playground-${{ matrix.name }} -p ${{ matrix.port }}:8080 playground-${{ matrix.name }}

      - name: Wait for ${{ matrix.name }} health endpoint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/poll_http_health.py \
            --url "http://127.0.0.1:${{ matrix.port }}/health" \
            --timeout "$((WEB_HEALTH_RETRIES * WEB_HEALTH_WAIT_SECONDS))" \
            --interval "$WEB_HEALTH_WAIT_SECONDS" \
            --expect-content-type application/json \
            --write-body /tmp/${{ matrix.name }}-health.json
          cat /tmp/${{ matrix.name }}-health.json

      - name: Show ${{ matrix.name }} container logs
        if: failure()
        shell: bash
        run: docker logs playground-${{ matrix.name }} || true

      - name: Stop ${{ matrix.name }} container
        if: always()
        shell: bash
        run: docker rm --force playground-${{ matrix.name }} || true

  test-container-smoke:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared_ci == 'true' ||
      needs.changes.outputs.test_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: smoke-redis-test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        uses: ./.github/actions/build-playground-image
        with:
          dockerfile: src/test/Dockerfile
          image: playground-test

      - name: Start test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --init --network host \
            --name playground-test \
            -e REDIS_HOST="$REDIS_SMOKE_HOST" \
            -e REDIS_PORT="$REDIS_SMOKE_PORT" \
            -e REDIS_KEY="$REDIS_SMOKE_KEY" \
            -e REDIS_VALUE="$REDIS_SMOKE_VALUE" \
            -e REDIS_SOCKET_CONNECT_TIMEOUT \
            -e REDIS_SOCKET_TIMEOUT \
            -e REDIS_BACKOFF_INITIAL_SECONDS \
            -e REDIS_BACKOFF_MAX_SECONDS \
            -e REDIS_BACKOFF_MULTIPLIER \
            -e SLEEP_SECONDS="$REDIS_SMOKE_SLEEP_SECONDS" \
            playground-test

      - name: Wait for Redis write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import socket
          import time

          smoke_key = os.environ["REDIS_SMOKE_KEY"].encode("utf-8")
          smoke_value = os.environ["REDIS_SMOKE_VALUE"].encode("utf-8")
          smoke_host = os.environ["REDIS_SMOKE_HOST"]
          smoke_port = int(os.environ["REDIS_SMOKE_PORT"])
          connect_timeout = float(os.environ["REDIS_SOCKET_CONNECT_TIMEOUT"])
          socket_timeout = float(os.environ["REDIS_SOCKET_TIMEOUT"])
          wait_seconds = float(os.environ["REDIS_SMOKE_WAIT_SECONDS"])
          command = b"*2\r\n$3\r\nGET\r\n$" + str(len(smoke_key)).encode("ascii") + b"\r\n" + smoke_key + b"\r\n"
          expected = b"$" + str(len(smoke_value)).encode("ascii") + b"\r\n" + smoke_value + b"\r\n"
          retries = int("${REDIS_SMOKE_RETRIES}")

          for _ in range(retries):
              try:
                  status = subprocess.check_output(
                      [
                          "docker",
                          "inspect",
                          "--format",
                          "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}",
                          "playground-test",
                      ],
                      text=True,
                  ).strip()
                  if status != "healthy":
                      time.sleep(wait_seconds)
                      continue
                  with socket.create_connection((smoke_host, smoke_port), timeout=connect_timeout) as sock:
                      sock.settimeout(socket_timeout)
                      sock.sendall(command)
                      payload = sock.recv(4096)
                  if expected in payload:
                      print(payload.decode("utf-8", errors="ignore"))
                      raise SystemExit(0)
              except (OSError, subprocess.CalledProcessError):
                  pass
              time.sleep(wait_seconds)

          raise SystemExit(1)
          PY

      - name: Show test container logs
        if: failure()
        shell: bash
        run: docker logs playground-test || true

      - name: Stop test container
        if: always()
        shell: bash
        run: docker rm --force playground-test || true

  workflow-summary:
    needs:
      - changes
      - collect
      - readme-code-paths
      - readme-markdown
      - docs-spelling
      - docker-smoke-docs
      - config-json-yaml
      - tracked-junk
      - readme-local-run
      - service-tests
      - container-smoke
      - test-container-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: workflow-summary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch workflow jobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          token = os.environ["GITHUB_TOKEN"]
          url = (
              f"{api_url}/repos/{repo}/actions/runs/{run_id}/attempts/"
              f"{run_attempt}/jobs?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          with open("workflow-jobs.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          PY

      - name: Render workflow summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_ci_summary.py workflow-jobs.json workflow-summary.md
          cat workflow-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-summary
          path: |
            workflow-summary.md
            workflow-jobs.json
