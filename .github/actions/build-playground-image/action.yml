name: Build Playground Image
description: Build one service image from the repo root with a fresh base image.

inputs:
  dockerfile:
    description: Path to the Dockerfile relative to the repo root.
    required: true
  image:
    description: Image tag to build.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.image }}
        load: true
        pull: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
