name: Setup Playground Python
description: Setup Python and install the shared test dependencies for the repo.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: |
          environment.yml
          pytest.ini
          requirements.txt
          src/test/requirements.txt
          src/disasters/requirements.txt
          src/ctscan/requirements.txt

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install \
          -r requirements.txt \
          -r src/test/requirements.txt \
          -r src/disasters/requirements.txt \
          -r src/ctscan/requirements.txt \
          pytest
